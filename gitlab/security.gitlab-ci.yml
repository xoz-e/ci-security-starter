spec:
  inputs:
    gitleaks_version:
      default: "8.30.1"
      description: gitleaks version, without a leading v
    gitleaks_checksum:
      default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      description: sha256 of gitleaks_<version>_linux_x64.tar.gz
    trivy_version:
      default: "0.76.2"
      description: Trivy version, without a leading v
    trivy_checksum:
      default: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
      description: sha256 of trivy_<version>_Linux-64bit.tar.gz
    kubeconform_version:
      default: "0.8.0"
      description: kubeconform version, without a leading v
    kubeconform_checksum:
      default: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
      description: sha256 of kubeconform-linux-amd64.tar.gz
    kubernetes_version:
      default: "1.37.2"
      description: Kubernetes version whose schema the manifests must match
    severity:
      default: "HIGH,CRITICAL"
      description: Trivy severities that fail the job
    ignore_unfixed:
      default: "true"
      options: ["true", "false"]
      description: Do not fail on vulnerabilities that have no fix yet. Set to "false" to fail on unfixed findings too.
    dockerfile:
      default: ""
      description: Dockerfile to build and scan. Empty skips the image job.
    image_context:
      default: "."
      description: Docker build context
    image_name:
      default: "scan:ci"
      description: Local image name to build and scan
    manifests:
      default: ""
      description: Manifest file or directory. Empty skips kubeconform.
---

# Secrets, filesystem, image, and Kubernetes schema checks.
# The image job needs a runner that can start Docker-in-Docker.

.alpine-tools:
  stage: test
  image: alpine:3.22.8
  before_script:
    - apk add --no-cache curl tar

gitleaks:
  extends: .alpine-tools
  variables:
    GIT_DEPTH: "0"
    TOOL_VERSION: "$[[ inputs.gitleaks_version ]]"
    TOOL_SHA256: "$[[ inputs.gitleaks_checksum ]]"
  script:
    - |
      set -euo pipefail
      archive="gitleaks_${TOOL_VERSION}_linux_x64.tar.gz"
      curl -sSfL -o "${archive}" \
        "https://github.com/gitleaks/gitleaks/releases/download/v${TOOL_VERSION}/${archive}"
      echo "${TOOL_SHA256}  ${archive}" | sha256sum -c -
      tar -xzf "${archive}" gitleaks
      install -m 0755 gitleaks /usr/local/bin/gitleaks
      gitleaks detect --source "${CI_PROJECT_DIR}" --redact --verbose --exit-code 1

trivy-fs:
  extends: .alpine-tools
  variables:
    TOOL_VERSION: "$[[ inputs.trivy_version ]]"
    TOOL_SHA256: "$[[ inputs.trivy_checksum ]]"
    SEVERITY: "$[[ inputs.severity ]]"
    IGNORE_UNFIXED: "$[[ inputs.ignore_unfixed ]]"
  script:
    - |
      set -euo pipefail
      archive="trivy_${TOOL_VERSION}_Linux-64bit.tar.gz"
      curl -sSfL -o "${archive}" \
        "https://github.com/aquasecurity/trivy/releases/download/v${TOOL_VERSION}/${archive}"
      echo "${TOOL_SHA256}  ${archive}" | sha256sum -c -
      tar -xzf "${archive}" trivy
      install -m 0755 trivy /usr/local/bin/trivy
      extra=""
      if [ "${IGNORE_UNFIXED}" = "true" ]; then
        extra="--ignore-unfixed"
      fi
      # shellcheck disable=SC2086
      trivy fs --exit-code 1 --severity "${SEVERITY}" --scanners vuln --no-progress ${extra} .

trivy-image:
  stage: test
  image: docker:28.5.2-cli-alpine3.22
  services:
    - name: docker:28.5.2-dind-alpine3.22
      alias: docker
  rules:
    - if: '"$[[ inputs.dockerfile ]]" != ""'
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    TOOL_VERSION: "$[[ inputs.trivy_version ]]"
    TOOL_SHA256: "$[[ inputs.trivy_checksum ]]"
    SEVERITY: "$[[ inputs.severity ]]"
    IGNORE_UNFIXED: "$[[ inputs.ignore_unfixed ]]"
    DOCKERFILE: "$[[ inputs.dockerfile ]]"
    IMAGE_CONTEXT: "$[[ inputs.image_context ]]"
    IMAGE_NAME: "$[[ inputs.image_name ]]"
  script:
    - |
      set -euo pipefail
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i + 1))
        if [ "${i}" -gt 30 ]; then
          echo "docker daemon did not become ready" >&2
          exit 1
        fi
        sleep 2
      done
      docker build -t "${IMAGE_NAME}" -f "${DOCKERFILE}" "${IMAGE_CONTEXT}"
      apk add --no-cache curl tar
      archive="trivy_${TOOL_VERSION}_Linux-64bit.tar.gz"
      curl -sSfL -o "${archive}" \
        "https://github.com/aquasecurity/trivy/releases/download/v${TOOL_VERSION}/${archive}"
      echo "${TOOL_SHA256}  ${archive}" | sha256sum -c -
      tar -xzf "${archive}" trivy
      install -m 0755 trivy /usr/local/bin/trivy
      extra=""
      if [ "${IGNORE_UNFIXED}" = "true" ]; then
        extra="--ignore-unfixed"
      fi
      # shellcheck disable=SC2086
      trivy image --exit-code 1 --severity "${SEVERITY}" --scanners vuln --no-progress ${extra} "${IMAGE_NAME}"

kubeconform:
  extends: .alpine-tools
  rules:
    - if: '"$[[ inputs.manifests ]]" != ""'
  variables:
    TOOL_VERSION: "$[[ inputs.kubeconform_version ]]"
    TOOL_SHA256: "$[[ inputs.kubeconform_checksum ]]"
    KUBERNETES_VERSION: "$[[ inputs.kubernetes_version ]]"
    MANIFESTS: "$[[ inputs.manifests ]]"
  script:
    - |
      set -euo pipefail
      archive="kubeconform-linux-amd64.tar.gz"
      curl -sSfL -o "${archive}" \
        "https://github.com/yannh/kubeconform/releases/download/v${TOOL_VERSION}/${archive}"
      echo "${TOOL_SHA256}  ${archive}" | sha256sum -c -
      tar -xzf "${archive}" kubeconform
      install -m 0755 kubeconform /usr/local/bin/kubeconform
      kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" "${MANIFESTS}"

name: Secrets

on:
  workflow_call:
    inputs:
      version:
        description: gitleaks version, without a leading v
        type: string
        required: false
        default: "8.30.1"
      checksum:
        description: sha256 of gitleaks_<version>_linux_x64.tar.gz
        type: string
        required: false
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Full history: gitleaks scans commits, not just the worktree.
        # persist-credentials: false so the job token is not left in .git/config.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.checksum }}
        run: |
          set -euo pipefail
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 gitleaks "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Scan git history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

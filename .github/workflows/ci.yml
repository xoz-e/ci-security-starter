name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    uses: ./.github/workflows/secrets.yml

  trivy:
    name: trivy
    uses: ./.github/workflows/trivy.yml
    with:
      dockerfile: sample/Dockerfile
      context: sample
      image: ci-security-starter-sample:ci

  manifests:
    name: manifests
    uses: ./.github/workflows/manifests.yml
    with:
      manifests: sample/k8s
      kubernetes_version: "1.37.2"
